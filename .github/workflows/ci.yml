name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Bash syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          for file in \
            bin/bootstrap-machine \
            bin/bootstrap-profile \
            bin/bootstrap-project \
            bin/codex-doctor \
            tests/dbhub-security-smoke.sh \
            platform/linux/machine.sh \
            platform/macos/machine.sh \
            wrappers/codex-code \
            wrappers/chrome-devtools \
            wrappers/mcporter \
            wrappers/od
          do
            bash -n "$file"
          done

      - name: Validate PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Syntax errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Host $_ }
            }
          }
          if ($failed) { throw "PowerShell syntax validation failed" }

      - name: Validate Python, JSON and TOML
        shell: bash
        run: |
          python -m py_compile lib/merge-project-mcporter.py
          python -c 'import json; json.load(open("templates/mcporter/global.json")); json.load(open("templates/mcporter/project-dbhub.json"))'
          python -c 'import glob,tomllib; [tomllib.load(open(p,"rb")) for p in glob.glob("templates/profiles/*/config.toml")]'

      - name: Validate repository structure
        shell: bash
        run: |
          test -s LICENSE
          test -s NOTICE
          test -s THIRD_PARTY_NOTICES
          test -s README.md
          test -s SECURITY.md
          test -s CONTRIBUTING.md
          test -s CODE_OF_CONDUCT.md
          test ! -d skills/ui-ux-pro-max
          grep -q 'UI_UX_PRO_MAX_VERSION="2.15.0"' manifests/tools.env
          grep -q 'CODEX_VERSION="0.160.0"' manifests/tools.env
          test "$(grep -R 'model = "gpt-6.1-sol"' templates/profiles/*/config.toml | wc -l)" -eq 8
          test "$(grep -R 'model_reasoning_effort = "medium"' templates/profiles/*/config.toml | wc -l)" -eq 8

      - name: Validate DBHub hardening
        shell: bash
        run: |
          grep -q 'DBHUB_VERSION="1.4.0"' manifests/tools.env
          grep -q '^lazy = true$' templates/project/dbhub.toml
          grep -q '^query_timeout = 10$' templates/project/dbhub.toml
          grep -q '^readonly = true$' templates/project/dbhub.toml
          grep -q '^max_rows = 500$' templates/project/dbhub.toml
          grep -q -- '--transport stdio' templates/project/dbhub-wrapper
          grep -q -- '--transport stdio' templates/project/windows/dbhub.ps1
          python - <<'PYDBHUB'
          from pathlib import Path
          import re

          bootstrap = Path("bin/windows/bootstrap-project.ps1").read_text()
          wrapper = Path("wrappers/windows/mcporter.ps1").read_text()
          smoke = Path("tests/dbhub-security-smoke.ps1").read_text()

          match = re.search(
              r'\$DbHubDefinition = \[PSCustomObject\]@\{(.*?)\n\s*\}',
              bootstrap,
              re.S,
          )
          assert match, "Configuração DBHub Windows ausente"
          block = match.group(1)

          for required in (
              'command = $DbHubNode',
              '$DbHubCli',
              '"--transport"',
              '"stdio"',
              '"--config"',
              r'${CODEX_PROJECT_ROOT}\.codex-local\dbhub\dbhub.toml',
          ):
              assert required in block, f"DBHub Windows: ausente {required}"

          assert "dbhub.cmd" not in block
          assert "dbhub.ps1" not in block
          assert '& $Node $Cli @args' in wrapper
          assert 'node_modules\\.bin\\mcporter.cmd' not in wrapper
          assert 'Invoke-DbHubSql' in smoke
          assert '--args $payload' in smoke
          assert 'dbhub.execute_sql(sql:' not in smoke

          print("DBHub Windows: transporte nativo validado")
          PYDBHUB
          ! grep -q '"dbhub"' templates/mcporter/global.json
          grep -q '"dbhub"' templates/mcporter/project-dbhub.json
          grep -qxF '.codex-local/' templates/project/git-info-exclude.txt
          grep -qxF 'config/mcporter.json' templates/project/git-info-exclude.txt

      - name: Git whitespace check
        shell: bash
        run: git show --check --format= HEAD
