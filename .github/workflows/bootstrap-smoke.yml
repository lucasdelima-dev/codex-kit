name: Bootstrap Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap machine (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./bin/bootstrap-machine

      - name: Bootstrap profiles (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$HOME/.codex"
          printf "{}\n" > "$HOME/.codex/auth.json"

          . ./manifests/tools.env

          for profile in lean backend frontend research security full experimental intraer
          do
            mkdir -p "$HOME/.codex-profiles/$profile/plugins/superpowers/$SUPERPOWERS_EXPECTED_VERSION"
          done

          ./bin/bootstrap-profile all

      - name: Neutral project smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PROJECT="$(mktemp -d)"
          git -C "$PROJECT" init
          ./bin/bootstrap-project "$PROJECT" --standard
          cd "$PROJECT"
          CODEX_KIT="$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/bin/codex-doctor"

      - name: DBHub security smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/dbhub-security-smoke.sh

      - name: Beads security smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/beads-security-smoke.sh

      - name: Agent-browser integrity smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/agent-browser-integrity-smoke.sh

      - name: Bootstrap machine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\bin\bootstrap-machine.ps1"

          "$HOME\.local\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          "$HOME\.local\npm" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          "$HOME\.local\opt\node24" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bootstrap profiles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME\.codex" | Out-Null
          "{}" | Set-Content "$HOME\.codex\auth.json"

          $line = Get-Content ".\manifests\tools.env" |
            Where-Object {
              $_ -match '^SUPERPOWERS_EXPECTED_VERSION='
            } |
            Select-Object -First 1

          $version = ($line -split "=", 2)[1].Trim().Trim('"')

          foreach ($profile in @(
            "lean", "backend", "frontend", "research",
            "security", "full", "experimental", "intraer"
          )) {
            New-Item `
              -ItemType Directory `
              -Force `
              "$HOME\.codex-profiles\$profile\plugins\superpowers\$version" |
              Out-Null
          }

          & ".\bin\bootstrap-profile.ps1" all

      - name: DBHub security smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ".\tests\dbhub-security-smoke.ps1"'

      - name: Beads security smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ".\tests\beads-security-smoke.ps1"'

      - name: Agent-browser integrity smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Join-Path $HOME ".local\npm\node_modules\agent-browser"
          $binary = Join-Path $root "bin\agent-browser-win32-x64.exe"
          $wrapper = Join-Path $root "bin\agent-browser.js"
          $node = Join-Path $HOME ".local\opt\node24\node.exe"

          $line = Get-Content "manifests/tools.env" |
            Where-Object {
              $_ -match '^AGENT_BROWSER_SHA256_WINDOWS_X64='
            } |
            Select-Object -First 1

          if (-not $line) { throw "Hash Windows não definido." }

          $expected = ($line -split "=", 2)[1].Trim('"')

          $actual = (
            Get-FileHash $binary -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($actual -ne $expected) {
            throw "Hash do agent-browser Windows divergente."
          }

          & $node $wrapper --version

          if ($LASTEXITCODE -ne 0) {
            throw "Wrapper Windows do agent-browser falhou."
          }

          Write-Host "Agent-browser Windows: integridade e wrapper OK"

      - name: Neutral project smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "codex-kit-smoke"
          New-Item -ItemType Directory -Force $project | Out-Null
          git -C $project init
          & ".\bin\bootstrap-project.ps1" $project --standard
          Push-Location $project
          try {
            & "$env:GITHUB_WORKSPACE\bin\codex-doctor.ps1"
          } finally {
            Pop-Location
          }
