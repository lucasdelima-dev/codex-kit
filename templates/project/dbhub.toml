# Credenciais NÃO ficam neste arquivo.
# Defina DBHUB_DSN no ambiente local.
# IMPORTANTE: readonly=true é uma proteção da ferramenta, não substitui
# permissões read-only no próprio banco. Prefira usuário de banco somente leitura.

[[sources]]
id = "project"
dsn = "${DBHUB_DSN}"
connection_timeout = 5
query_timeout = 10

[[tools]]
name = "execute_sql"
source = "project"
readonly = true
max_rows = 500

[[tools]]
name = "search_objects"
source = "project"
